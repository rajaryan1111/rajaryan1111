<svg xmlns="http://www.w3.org/2000/svg" width="370" height="320" viewBox="0 0 370 320" role="img" aria-labelledby="title desc">
<title id="title">Raj Aryan ASCII identity art</title>
<desc id="desc">Monochrome ASCII-style RA monogram revealed line by line in a terminal window.</desc>
<defs><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{opacity:0;animation:reveal .4s ease-out forwards}
.r1{animation-delay:.15s}.r2{animation-delay:.3s}.r3{animation-delay:.45s}.r4{animation-delay:.6s}.r5{animation-delay:.75s}.r6{animation-delay:.9s}.r7{animation-delay:1.05s}.r8{animation-delay:1.2s}.r9{animation-delay:1.35s}.r10{animation-delay:1.5s}.r11{animation-delay:1.65s}.r12{animation-delay:1.8s}
@keyframes reveal{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:translateX(0)}}
.cursor{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media(prefers-reduced-motion:reduce){.row,.cursor{animation:none;opacity:1;visibility:visible}}
</style></defs>
<rect x="1" y="1" width="368" height="318" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M1 35H369" stroke="#30363d"/>
<circle cx="16" cy="18" r="4" fill="#ff6b6b"/><circle cx="29" cy="18" r="4" fill="#ffd166"/><circle cx="42" cy="18" r="4" fill="#06d6a0"/>
<text x="58" y="22" fill="#8b949e" font-size="10" class="mono">rajaryan@github: ~/identity</text>
<g class="mono" font-size="12" fill="#c9d1d9">
<text x="14" y="58" fill="#7ee787">$ render --style ascii</text>
<text x="14" y="86" class="row r1">       .-=========-.</text>
<text x="14" y="104" class="row r2">      /  .-----.   \</text>
<text x="14" y="122" class="row r3">     |  /  ___  \   |</text>
<text x="14" y="140" class="row r4">     | |  / _ \ |  |</text>
<text x="14" y="158" class="row r5">     | | | (_) ||  |</text>
<text x="14" y="176" class="row r6">     | |  \___/ |  |</text>
<text x="14" y="194" class="row r7">     |  '-----'   |</text>
<text x="14" y="212" class="row r8">      \_________/</text>
<text x="14" y="238" class="row r9" fill="#7ee787">        RA // AI</text>
<text x="14" y="258" class="row r10">  AGENTIC SYSTEMS · RAG</text>
<text x="14" y="278" class="row r11">  BUILT WITH CURIOSITY</text>
<text x="14" y="300" class="row r12" fill="#7ee787">  ready<span class="cursor">_</span></text>
</g></svg>