<svg xmlns="http://www.w3.org/2000/svg" width="490" height="320" viewBox="0 0 490 320" role="img" aria-labelledby="title desc">
<title id="title">Raj Aryan Neofetch-style profile</title><desc id="desc">A terminal information card with AI engineering focus, flagship project, stack, and current status that appears line by line.</desc>
<defs><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.line{opacity:0;animation:linein .45s ease-out forwards}
.a1{animation-delay:.2s}.a2{animation-delay:.45s}.a3{animation-delay:.7s}.a4{animation-delay:.95s}.a5{animation-delay:1.2s}.a6{animation-delay:1.45s}.a7{animation-delay:1.7s}.a8{animation-delay:1.95s}.a9{animation-delay:2.2s}
@keyframes linein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.cursor{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
@media(prefers-reduced-motion:reduce){.line,.cursor{animation:none;opacity:1;visibility:visible}}
</style></defs>
<rect x="1" y="1" width="488" height="318" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M1 35H489" stroke="#30363d"/><circle cx="16" cy="18" r="4" fill="#ff6b6b"/><circle cx="29" cy="18" r="4" fill="#ffd166"/><circle cx="42" cy="18" r="4" fill="#06d6a0"/>
<text x="58" y="22" fill="#8b949e" font-size="10" class="mono">rajaryan@github: ~</text>
<g class="mono" font-size="12">
<text x="18" y="59" fill="#7ee787">$ neofetch --profile</text>
<text x="18" y="86" fill="#f0f6fc" font-size="18" font-weight="700" class="line a1">RAJ ARYAN</text>
<text x="18" y="108" fill="#8b949e" class="line a2">AI/ML · AGENTIC AI · LLM APPLICATIONS</text>
<text x="18" y="138" fill="#79c0ff" class="line a3">FLAGSHIP</text>
<text x="122" y="138" fill="#f0f6fc" class="line a3">AI Career Agent</text>
<text x="18" y="162" fill="#79c0ff" class="line a4">FOCUS</text>
<text x="122" y="162" fill="#c9d1d9" class="line a4">RAG · AI agents · practical ML</text>
<text x="18" y="186" fill="#79c0ff" class="line a5">STACK</text>
<text x="122" y="186" fill="#c9d1d9" class="line a5">Python · TypeScript · React</text>
<text x="18" y="210" fill="#79c0ff" class="line a6">BACKEND</text>
<text x="122" y="210" fill="#c9d1d9" class="line a6">FastAPI · PostgreSQL · SQLite</text>
<text x="18" y="234" fill="#79c0ff" class="line a7">PRINCIPLES</text>
<text x="122" y="234" fill="#c9d1d9" class="line a7">Tests · safety · evidence</text>
<text x="18" y="258" fill="#79c0ff" class="line a8">STATUS</text>
<text x="122" y="258" fill="#c9d1d9" class="line a8">Building and learning daily</text>
<text x="18" y="292" fill="#7ee787" class="line a9">[ profile loaded ]<tspan class="cursor">_</tspan></text>
</g></svg>