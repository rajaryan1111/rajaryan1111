name: Update profile contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-heatmap-refresh
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only daily-workflow dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Test contribution parsing and streak calculations
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch real public contribution data
        run: python scripts/fetch_contributions.py
      - name: Render animated contribution SVG
        run: python scripts/render_heatmap_svg.py
      - name: Commit refreshed graph when changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
